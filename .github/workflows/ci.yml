name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: confluence-mcp/requirements.txt
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r confluence-mcp/requirements.txt
      - name: Run tests
        env:
          CONFLUENCE_URL: https://example.atlassian.net
          CONFLUENCE_EMAIL: user@example.com
          CONFLUENCE_API_TOKEN: test-token
          SQLITE_PATH: data/test_weekly_progress.db
        run: |
          PYTHONPATH="confluence-mcp/backend:confluence-mcp" pytest -q confluence-mcp/backend/tests

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: confluence-mcp/frontend/package-lock.json
      - name: Install deps
        working-directory: confluence-mcp/frontend
        run: npm ci
      - name: Build
        working-directory: confluence-mcp/frontend
        run: npm run build

